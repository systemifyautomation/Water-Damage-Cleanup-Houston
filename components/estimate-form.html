<!-- Copy this complete block into any page that loads assets/style.css and assets/main.js. -->
<form class="form-card estimate-form" data-estimate-form data-form-name="page_estimate">
  <div class="form-row">
    <div class="field"><label for="estimate-name">Name</label><input id="estimate-name" name="name" autocomplete="name" placeholder="Your full name" required></div>
    <div class="field"><label for="estimate-phone">Phone</label><input id="estimate-phone" name="phone" type="tel" autocomplete="tel-national" inputmode="numeric" maxlength="14" data-us-phone placeholder="(713) 555-0123" title="Enter a 10-digit U.S. phone number without +1" required></div>
  </div>
  <div class="form-row">
    <div class="field"><label for="estimate-email">Email</label><input id="estimate-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
    <div class="field"><label id="estimate-services-label">Services needed</label><details class="service-multiselect"><summary aria-labelledby="estimate-services-label"><span data-services-summary>Select one or more services</span></summary><div class="service-multiselect__options"><label><input name="services" type="checkbox" value="Emergency Water Removal"> Emergency Water Removal</label><label><input name="services" type="checkbox" value="Water Damage Restoration"> Water Damage Restoration</label><label><input name="services" type="checkbox" value="Water Extraction"> Water Extraction</label><label><input name="services" type="checkbox" value="Flood Damage Cleanup"> Flood Damage Cleanup</label><label><input name="services" type="checkbox" value="Burst Pipe Cleanup"> Burst Pipe Cleanup</label><label><input name="services" type="checkbox" value="Sewage Backup Cleanup"> Sewage Backup Cleanup</label><label><input name="services" type="checkbox" value="Not Sure"> Not Sure</label></div></details></div>
  </div>
  <div class="field"><label for="estimate-details">What happened?</label><textarea id="estimate-details" name="details" placeholder="Briefly describe the water damage, affected area, and when it happened."></textarea></div>
  <div class="field field--honeypot" aria-hidden="true"><label for="estimate-website">Website</label><input id="estimate-website" name="website" tabindex="-1" autocomplete="off"></div>
  <div class="button-group"><button class="btn btn--lg" type="submit">Request My Free Estimate</button></div>
  <p class="form-status" data-form-status role="status" aria-live="polite" hidden></p>
</form>
